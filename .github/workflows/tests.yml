name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/tests.yml
      - name: Install packages
        run: |
          python -m pip install numpy pandas pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run the tests
        run: python -m pytest -q
      - name: Check the JavaScript model against the Python one
        run: node tests/check_web_model.js
